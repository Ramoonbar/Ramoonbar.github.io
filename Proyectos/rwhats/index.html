<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="Css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <title>Chat de WhatsApp personalizado</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%238995cc%22><path d=%22M21 3L3 10.53L10.91 13.09L13.47 21L21 3Z%22/></svg>">
</head>
<body>
    <div class="chat">
        <div class="chat-header">
            <img src="Img/ramon.jpg" alt="Foto de perfil" class="avatar" id="profile-image">
            <div class="header-info">
                <h1>RDisseny</h1>
                <p id="last-connection">Última conexión: 12:30</p>
            </div>
        </div>
        <div class="chat-container" id="chat-container">
            <!-- Mensajes se agregarán dinámicamente aquí -->
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Escribe un mensaje...">
            <i id="enviar-icon" class="fa-solid fa-location-arrow" onclick="enviarMensaje()"></i>
        </div>
    </div>
    <script src="JavaScript/script.js"></script>
       

</body>
</html>
